<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MailVault</title>
<style>
  body { font: 14px sans-serif; margin: 16px; max-width: 1000px; }
  h1 { font-size: 22px; margin: 0; }
  header { display: flex; align-items: center; gap: 16px; }
  .logo { font: bold 15px/1.05 monospace; color: #1a5fb4; margin: 0; }
  h3 { margin: 18px 0 6px; }
  label { display: block; margin: 6px 0; }
  input[type=text], input[type=number] { font-size: 14px; padding: 4px; }
  button { font-size: 14px; padding: 6px 14px; margin: 8px 8px 8px 0; }
  textarea { width: 100%; height: 380px; font: 12px monospace; }
  table { border-collapse: collapse; font-size: 13px; }
  td, th { border: 1px solid #ccc; padding: 3px 8px; text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  .opis { color: #555; font-size: 13px; }
  .uwaga { color: #c00; font-weight: bold; }
  .brak { color: #c00; font-weight: bold; }
</style>
</head>
<body>
<header>
<pre class="logo" aria-hidden="true">
     /\
    /  \
   /    \
  /______\
  |\    /|
  | \__/ |
  |______|</pre>
<div><h1>MailVault</h1><p id="wersja" class="opis"></p>
<p class="opis">&copy; 2026 .kei &middot; GPL-3.0-or-later &middot; https://github.com/shimomurakei/mailvault</p></div>
</header>
<p id="aktywne"></p>

<h3 data-t="hAuto"></h3>
<label><input id="autoStart" type="checkbox"> <span data-t="autoStart"></span></label>
<label><input id="autoCo" type="checkbox"> <span data-t="autoCo1"></span>
  <input id="interwal" type="number" min="5" value="60" style="width:70px"> <span data-t="autoCo2"></span></label>

<h3 data-t="hKonto"></h3>
<input id="konto" type="text" size="44" list="konta">
<datalist id="konta"></datalist>
<p class="opis" data-t="kontoOpis"></p>

<h3 data-t="hKroki"></h3>
<label><input id="podglad" type="checkbox"> <b data-t="podglad"></b></label>
<label><input id="odbuduj" type="checkbox"> 1. <span data-t="k1"></span></label>
<label><input id="odswiez" type="checkbox"> 2. <span data-t="k1s"></span></label>
<label><input id="kopiuj" type="checkbox"> 3. <span data-t="k2"></span></label>
<label><input id="sortuj" type="checkbox"> 4. <span data-t="k3"></span></label>
<label><input id="duplikaty" type="checkbox"> 5. <span data-t="k4"></span></label>
<label><input id="kosz" type="checkbox"> 6. <span data-t="k5"></span></label>
<label><input id="oproznij" type="checkbox"> 7. <span data-t="k6"></span></label>

<div>
  <button id="zapisz" data-t="zapisz"></button>
  <button id="teraz" data-t="teraz"></button>
  <button id="stop" data-t="stop"></button>
  <span id="stan"></span>
</div>

<h3 data-t="hIndeks"></h3>
<p class="opis" data-t="indeksOpis"></p>
<table id="indeks"></table>

<h3 data-t="hDziennik"></h3>
<p class="opis" data-t="dziennikOpis"></p>
<div>
  <button id="plik" data-t="plik"></button>
  <button id="wyczysc" data-t="wyczysc"></button>
</div>
<textarea id="dziennik" readonly></textarea>

<script src="options.js"></script>
</body>
</html>
